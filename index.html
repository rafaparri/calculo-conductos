<!doctype html><html lang="es"><head><meta charset=utf8><title>Cálculo de Conductos</title><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: panel lateral de proyectos + área de trabajo con pestañas por red; tabla técnica con bloques Rectangular / Circular sombreados por material */
:root{
  --bg:#eef1f3; --panel:#ffffff; --panel2:#f6f8f9; --ink:#16212a; --muted:#566370; --line:#d3dae0; --line2:#e6eaee;
  --accent:#3a5699; --accent-ink:#ffffff; --accent-soft:#e3e9f5; --brand-g:#0b7a52;
  --chapa:#245f8c; --chapa-bg:#dcebf7; --fibra:#9a6a08; --fibra-bg:#f7ebcd; --circ:#25704f; --circ-bg:#d9efe3;
  --warn:#b4400b; --warn-bg:#fbe6da; --ok:#25704f;
  --f-ui:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-head:"Barlow Semi Condensed","Barlow",system-ui,sans-serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11171c; --panel:#192127; --panel2:#1e272e; --ink:#e5ecf1; --muted:#9aa8b3; --line:#2e3a43; --line2:#253038;
  --accent:#8ea8e6; --accent-ink:#0f1522; --accent-soft:#222f4a;
  --chapa:#86bde6; --chapa-bg:#1c3446; --fibra:#e2b452; --fibra-bg:#3a2e12; --circ:#7fcfa8; --circ-bg:#163a2b;
  --warn:#f39b6b; --warn-bg:#3d2216; --ok:#7fcfa8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171c; --panel:#192127; --panel2:#1e272e; --ink:#e5ecf1; --muted:#9aa8b3; --line:#2e3a43; --line2:#253038;
  --accent:#8ea8e6; --accent-ink:#0f1522; --accent-soft:#222f4a;
  --chapa:#86bde6; --chapa-bg:#1c3446; --fibra:#e2b452; --fibra-bg:#3a2e12; --circ:#7fcfa8; --circ-bg:#163a2b;
  --warn:#f39b6b; --warn-bg:#3d2216; --ok:#7fcfa8; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-ui);font-size:17px;line-height:1.4;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;max-width:1700px;margin:0 auto}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)}}
@media (min-width:901px){.app.fold{grid-template-columns:minmax(0,1fr)}.app.fold .side{display:none}}
.foldbtn{align-self:flex-start}
@media (max-width:900px){.foldbtn{display:none}}

/* barra lateral */
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;padding:4px 2px}
.brand .logo{flex:none;background:#fff;border-radius:10px;padding:4px;border:1px solid var(--line);display:grid}
.brand .logo img{width:64px;height:64px;display:block}
.brand h1{font-size:24px;font-weight:700}
.brand small{display:block;font-family:var(--f-ui);font-size:14px;color:var(--muted);font-weight:500;letter-spacing:0}
.plist{display:flex;flex-direction:column;gap:4px}
.pitem{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:var(--r);padding:10px 12px;cursor:pointer}
.pitem:hover{background:var(--panel)}
.pitem.on{background:var(--panel);border-color:var(--line);box-shadow:inset 3px 0 0 var(--accent)}
.pitem b{display:block;font-weight:600;font-size:17px}
.pitem span{display:block;font-size:14px;color:var(--muted)}
.status{font-size:14px;color:var(--muted);padding:2px 4px}
.status.err{color:var(--warn)}

/* botones */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:8px 14px;cursor:pointer;font-weight:600;font-size:16px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--warn)}
.btn.danger.armed{background:var(--warn);color:#fff;border-color:var(--warn)}
.btn:focus-visible,.pitem:focus-visible,input:focus-visible,select:focus-visible,.tab:focus-visible,.pick:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* panel principal */
.main{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.phead{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.fld input,.fld select{border:1px solid var(--line);border-radius:6px;background:var(--panel2);padding:8px 10px;font-size:17px;width:100%;min-width:0}
.fld.big input{font-family:var(--f-head);font-size:22px;font-weight:600}
.fld.wide{grid-column:span 2}
@media (max-width:520px){.fld.wide{grid-column:auto}}
details.cfg summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:15px;margin-top:12px}
details.cfg .phead{margin-top:10px}

.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--line)}
.tab{border:1px solid transparent;border-bottom:none;background:transparent;padding:9px 16px;border-radius:8px 8px 0 0;cursor:pointer;font-weight:600;font-size:16px;color:var(--muted);margin-bottom:-2px}
.tab.on{background:var(--panel);border-color:var(--line);color:var(--ink);border-bottom:2px solid var(--panel)}
.tab.add{color:var(--accent)}
.tab .pa{font-weight:500;font-size:14px;color:var(--muted);margin-left:6px}

/* tabla */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:16px;font-variant-numeric:tabular-nums}
.t th,.t td{padding:6px 5px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap;vertical-align:middle}
.t thead th{background:var(--panel2);font-weight:600;font-size:14px;color:var(--muted);position:sticky;top:0}
.t thead tr.g th{font-family:var(--f-head);font-size:15px;text-transform:uppercase;letter-spacing:.08em;text-align:center;color:var(--ink)}
.t th.bl,.t td.bl{border-left:2px solid var(--line)}
.t td input{width:58px;border:1px solid var(--line);border-radius:5px;background:var(--panel2);padding:5px 6px;text-align:right;font-size:16px;font-variant-numeric:tabular-nums}
.t td input.n{width:46px;text-align:center}
.t td input.q{width:70px}
.t td input.d{width:58px}
.t td input.fixed{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.t td input.over{color:var(--warn);border-color:var(--warn)}
.t td input.adj{border-color:var(--fibra);border-style:dashed;font-weight:600}
.dim{display:inline-flex;align-items:center;gap:3px}
.dim i{font-style:normal;color:var(--muted)}
.auto{border:none;background:none;color:var(--accent);cursor:pointer;font-size:13px;font-weight:700;padding:0 2px}
.t td.blk{cursor:pointer;color:var(--muted)}
.t td.blk.s-chapa{background:var(--chapa-bg);color:var(--ink)}
.t td.blk.s-fibra{background:var(--fibra-bg);color:var(--ink)}
.t td.blk.s-circ{background:var(--circ-bg);color:var(--ink)}
.picks{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.pick{border:none;background:var(--panel);padding:5px 7px;cursor:pointer;font-size:14px;font-weight:700;letter-spacing:.03em;color:var(--muted)}
.pick+.pick{border-left:1px solid var(--line)}
.pick.on.chapa{background:var(--chapa);color:var(--panel)}
.pick.on.fibra{background:var(--fibra);color:var(--panel)}
.pick.on.circ{background:var(--circ);color:var(--panel)}
.vwarn{color:var(--warn);font-weight:700}
.acum{font-weight:600}
tr.crit td.acum{color:var(--warn)}
tr.crit td.acum::before{content:"●";font-size:10px;margin-right:5px;vertical-align:2px}
tr.noconn td.acum{color:var(--muted);font-style:italic;font-weight:400}
.ract{display:inline-flex;gap:2px}
.ic{border:1px solid transparent;background:none;border-radius:5px;width:30px;height:30px;cursor:pointer;color:var(--muted);display:inline-grid;place-items:center}
.ic:hover{border-color:var(--line);color:var(--ink)}
.ic.del:hover{color:var(--warn)}
.t td.tr{text-align:left}
.t td.tr input{width:44px;text-align:center}
.t tfoot td{border-bottom:none;padding:10px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:14px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px}

/* resumen de pérdidas */
.pgrid{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:12px;align-items:stretch}
@media (max-width:760px){.pgrid{grid-template-columns:minmax(0,1fr)}.pgrid .op{display:none}}
.pbox{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--panel2)}
.pbox .lbl{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.pbox .val{font-family:var(--f-head);font-size:34px;font-weight:700;line-height:1}
.pbox .val small{font-size:18px;font-weight:600;color:var(--muted);margin-left:4px}
.pbox .sub{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.pbox.tot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pbox.tot .lbl,.pbox.tot .sub,.pbox.tot .val small{color:var(--accent-ink);opacity:.85}
.pbox input{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:6px 8px;font-size:17px;width:100%;min-width:0}
.pbox .difv{display:flex;align-items:center;gap:6px}
.pbox .difv input{font-family:var(--f-head);font-size:28px;font-weight:700;width:120px;text-align:right}
.op{display:grid;place-items:center;font-family:var(--f-head);font-size:30px;color:var(--muted)}

/* medición */
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.mcol{border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.mcol h3{font-size:18px;padding:10px 12px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mcol.chapa h3{background:var(--chapa-bg);color:var(--chapa)}
.mcol.fibra h3{background:var(--fibra-bg);color:var(--fibra)}
.mcol.circ h3{background:var(--circ-bg);color:var(--circ)}
.mcol h3 span{font-size:15px;font-weight:600;color:var(--ink)}
.mt{width:100%;border-collapse:collapse;font-size:16px;font-variant-numeric:tabular-nums}
.mt th,.mt td{padding:6px 12px;text-align:right;border-bottom:1px solid var(--line2)}
.mt th{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.mt td:first-child,.mt th:first-child{text-align:left}
.mt tr.tot td{font-weight:700;border-bottom:none}
.mt tr.mer td{color:var(--muted)}
.mt tr.fin td{font-weight:700;font-size:18px;border-top:2px solid var(--line)}
.mnote{font-size:13px;color:var(--muted);padding:8px 12px 10px;line-height:1.35}
.empty{color:var(--muted);padding:14px 12px;font-size:15px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sec-h h2{font-size:22px}
.hint{font-size:14px;color:var(--muted)}
.welcome{display:flex;flex-direction:column;gap:14px;align-items:flex-start;padding:28px}
.welcome h2{font-size:28px}
.welcome p{margin:0;max-width:60ch;color:var(--muted)}
.toast[hidden]{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;display:flex;gap:14px;align-items:center;z-index:20;font-size:16px;max-width:calc(100% - 32px)}
.toast button{background:none;border:none;color:var(--bg);font-weight:700;text-decoration:underline;cursor:pointer}
.chipg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.chipg button{border:none;background:var(--panel2);padding:7px 11px;cursor:pointer;font-weight:600;font-size:15px;color:var(--muted)}
.chipg button+button{border-left:1px solid var(--line)}
.chipg button.on{background:var(--accent);color:var(--accent-ink)}
.path{font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Modo móvil por pantallas (solo pantallas estrechas) ===== */
@media (max-width:760px){
  .app.mobp .side{display:none}
  .foldbtn{display:none!important}
  body{padding-bottom:120px}
  .mtop{display:flex;align-items:center;gap:10px;min-width:0}
  .mtop b{font-family:var(--f-head);font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .msteps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .msteps button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 2px;font-size:14px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;min-width:0}
  .msteps i{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);font-size:15px}
  .msteps .on{border-color:var(--accent);color:var(--ink)}
  .msteps .on i{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .msteps .done i{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft)}
  .mcard h2{font-size:24px;margin-bottom:14px}
  .mf{display:flex;flex-direction:column;gap:14px}
  .mf .fld label{font-size:14px}
  .mf .fld input,.mf .fld select{font-size:19px;padding:12px;min-height:50px}
  .mf .fld.big input{font-size:22px}
  .mcirc{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .mcirc button{border:1px solid var(--line);background:var(--panel2);border-radius:22px;padding:10px 16px;font-weight:600;font-size:16px;cursor:pointer}
  .mcirc .on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .mcirc .add{color:var(--accent);background:transparent}
  .mchip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .mchip button{padding:13px 4px;font-size:16px}
  .mt3h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .mt3h h2{font-size:24px;overflow-wrap:anywhere}
  .tcards{display:flex;flex-direction:column;gap:12px}
  .tcard{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
  .tcard.m-chapa{border-left-color:var(--chapa)}
  .tcard.m-fibra{border-left-color:var(--fibra)}
  .tcard.m-circ{border-left-color:var(--circ)}
  .tc-h{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
  .tc-nd{font-family:var(--f-head);font-weight:700;font-size:19px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .tc-nd input{width:58px;text-align:center;font-size:19px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
  .tcard.crit .tc-nd::after{content:"● Desfavorable";font-family:var(--f-ui);font-size:14px;color:var(--warn);font-weight:600}
  .tc-g3{display:grid;grid-template-columns:1.3fr 1fr .8fr;gap:8px}
  .tc-g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tf{display:flex;flex-direction:column;gap:4px;min-width:0}
  .tf>span{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center;gap:4px;min-height:22px}
  .tf input{width:100%;min-width:0;font-size:20px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);text-align:right;font-variant-numeric:tabular-nums}
  .tf input.fixed{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
  .tf input.adj{border-color:var(--fibra);border-style:dashed;font-weight:600}
  .tf input.over{color:var(--warn);border-color:var(--warn)}
  .tf .auto{font-size:13px;padding:2px 6px;border:1px solid var(--accent);border-radius:5px}
  .tc-pk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-radius:8px}
  .tc-pk .pick{padding:13px 4px;font-size:15px}
  .tc-res{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:16px;font-variant-numeric:tabular-nums;background:var(--panel2);border-radius:8px;padding:9px 11px}
  .tc-res .acum{font-weight:700}
  .tcard.crit .tc-res .acum{color:var(--warn)}
  .tcard.noconn .tc-res .acum{color:var(--muted);font-style:italic}
  .tcard .ic{width:42px;height:42px}
  .btn.big{width:100%;justify-content:center;padding:15px;font-size:18px;margin-top:4px}
  .mnav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
  .mnav .btn{padding:13px 14px;font-size:17px}
  .mnav .btn:disabled{opacity:.35;cursor:default}
  .mnt{text-align:center;line-height:1.15;min-width:0}
  .mnt small{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mnt b{font-family:var(--f-head);font-size:23px;font-variant-numeric:tabular-nums}
  .mtot{background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
  .mtot .val{font-family:var(--f-head);font-size:42px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
  .mtot .lbl,.mtot .sub{opacity:.9;font-size:15px}
  .mres .path{margin:0 0 14px}
  .toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
}
</style>

<div class="app">
  <aside class="side">
    <div class="brand">
      <span class="logo"><img id="brandLogo" alt="SDC Mantenimiento" width="64" height="64"></span>
      <h1>Conductos<small>Cálculo de circuitos de aire</small></h1>
    </div>
    <button class="btn pri" id="newProj" type="button">+ Nuevo proyecto</button>
    <div class="plist" id="plist"></div>
    <div class="status" id="status">Cargando…</div>
    <div class="row">
      <button class="btn ghost" id="impBtn" type="button">Importar copia</button>
      <input type="file" id="impFile" accept=".json,application/json" hidden>
    </div>
  </aside>
  <div class="main"><button class="btn ghost foldbtn" id="foldBtn" type="button">◂ Ocultar proyectos</button><main class="main" id="main"></main></div>
</div>

  let Dh, sec, H, Kc;
  if(geo.tipo==='rect'){
    H=geo.a/25.4; const b=geo.b/25.4;
    Dh=1.3*Math.pow(H*b,0.625)/Math.pow(H+b,0.25);
    sec=(H*b)/144/10.8;
    const r=b/H;
    Kc = r<=0.5?5 : r<=1?7 : r<=3?8 : r<=6?12 : 20;
  } else {
    H=geo.d/25.4; Dh=H; sec=Math.PI*Math.pow(geo.d/1000,2)/4; Kc=7;
  }
  const v=q/(3600*sec);
  const Ap=2.7*Math.pow(v*0.2,1.82)/Math.pow(Dh,1.22);  // pulg c.a./100 ft
  const paM=Ap*83.828*9.8/100;                           // Pa/m
  const Tc=n*(H/12)*Kc;                                  // long. equivalente codos (ft)
  const pt=Ap/100*(L*3.3+Tc)*25.4*9.8;                   // Pa del tramo
  return {v,paM,pt};
}
const num=s=>{if(s===null||s===undefined)return NaN;const x=parseFloat(String(s).replace(',','.'));return isFinite(x)?x:NaN};
const fmt=(x,d=2)=>isFinite(x)?x.toLocaleString('es-ES',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
const dm=x=>x.toLocaleString('es-ES',{maximumFractionDigits:1});
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TIPOS_C=['Extracción','Impulsión','Retorno','Aire exterior','Otro'];
const DEF_SERIE='80,100,125,150,160,200,250,300,315,355,400,450,500,560,630,710,800,900,1000,1120,1250';
const defCfg=()=>({mermaChapa:'10',mermaFibra:'20',paso:'50',anchoMin:'150',serie:DEF_SERIE,relMax:'3',ut:'0.120',utOtra:'',piezaL:'1',rInt:'100'});
const UTS=[['0.024','Vaina (0,024 m)'],['0.120','Perfil integral 20 (0,120 m)'],['0.170','Perfil integral 30 (0,170 m)'],['otra','Otra unión (desarrollo en mm)']];
function utVal(cfg){ return cfg.ut==='otra'?(num(cfg.utOtra)||0)/1000:(num(cfg.ut)||0); }
// UNE 100716: superficie de chapa rectangular de un tramo (piezas rectas + codos, mínimo 1 m² por pieza)
function uneChapa(r,cfg){
  const A=r.alto/1000, B=r.ancho/1000, per=2*(A+B), UT=utVal(cfg);
  const R=(num(cfg.rInt)||0)/1000, pl=Math.max(0.1,num(cfg.piezaL)||1);
  const codoExt=Math.PI/2*(R+B), codoEje=Math.PI/2*(R+B/2);
  const n=Math.max(0,Math.round(r.n||0));
  const Lr=Math.max(0,r.L-n*codoEje);
  let sr=0, piezas=0, rest=Lr;
  while(rest>1e-6){ const l=Math.min(pl,rest); sr+=Math.max(1,per*(l+UT)); rest-=l; piezas++; }
  const sc=n*Math.max(1,per*(codoExt+UT));
  return {m2:sr+sc,sr,sc,piezas};
}

function anchoMinV(q,alto,vmax,cfg,min){
  const paso=Math.max(5,num(cfg.paso)||50);
  let b=min;
  for(let k=0;k<400;k++){ if(perdida(q,1,0,{tipo:'rect',a:alto,b}).v<=vmax+1e-9) return b; b+=paso; }
  return b;
}
// Dimensionado por defecto: ancho por velocidad y relación de lados ≤ 1:relMax (si no cabe, sube el alto)
function rectAuto(q,alto,vmax,cfg){
  const paso=Math.max(5,num(cfg.paso)||50), min=Math.max(paso,num(cfg.anchoMin)||150);
  const rel=Math.max(1,num(cfg.relMax)||3);
  let a=alto;
  for(let k=0;k<400;k++){
    const bMin=Math.max(min,Math.ceil(a/rel/paso-1e-9)*paso);
    const b=anchoMinV(q,a,vmax,cfg,bMin);
    if(b/a<=rel+1e-9) return {alto:a,ancho:b};
    a+=paso;
  }
  return {alto:a,ancho:anchoMinV(q,a,vmax,cfg,min)};
}
function diamAuto(q,vmax,cfg){
  const s=String(cfg.serie||DEF_SERIE).split(/[;,\s]+/).map(num).filter(x=>x>0).sort((a,b)=>a-b);
  for(const d of s){ if(q/3600/(Math.PI*Math.pow(d/1000,2)/4)<=vmax+1e-9) return d; }
  return s[s.length-1]||100;
}

function calcRed(red,cfg){
  const vmax=num(red.vmax)||4, altoDef=num(red.alto)||200;
  const rows=red.tramos.map(t=>{
    const q=num(t.q), L=num(t.l)||0, n=num(t.n)||0;
    const alto=num(t.alto)||altoDef;
    const ok=q>0;
    const r={ok,q,L,n,alto,altoBase:alto};
    if(!ok) return r;
    const rel=Math.max(1,num(cfg.relMax)||3);
    if(num(t.ancho)>0){ r.ancho=num(t.ancho); r.anchoAuto=r.ancho; }
    else { const d=rectAuto(q,alto,vmax,cfg); r.alto=d.alto; r.ancho=d.ancho; r.anchoAuto=d.ancho; }
    r.altoAdj=r.alto!==r.altoBase;
    r.relBad=Math.max(r.alto,r.ancho)/Math.min(r.alto,r.ancho)>rel+1e-9;
    r.diamAuto=diamAuto(q,vmax,cfg);
    r.diam=num(t.diam)>0?num(t.diam):r.diamAuto;
    r.rect=perdida(q,L,n,{tipo:'rect',a:r.alto,b:r.ancho});
    r.circ=perdida(q,L,n,{tipo:'circ',d:r.diam});
    r.sel=t.tipo==='circ'?r.circ:r.rect;
    r.pt=r.sel.pt;
    return r;
  });
  // grafo de nudos
  const key=s=>String(s??'').trim();
  const adj=new Map();
  red.tramos.forEach((t,ix)=>{
    const a=key(t.i), b=key(t.f);
    if(!rows[ix].ok||!a||!b||a===b) return;
    (adj.get(a)||adj.set(a,[]).get(a)).push(ix);
    (adj.get(b)||adj.set(b,[]).get(b)).push(ix);
  });
  let fan=key(red.nudoVent), fanAuto=false;
  if(!fan||!adj.has(fan)){
    fanAuto=true; fan='';
    let best=-1;
    for(const [nd,list] of adj){ if(list.length===1){ const q=rows[list[0]].q; if(q>=best){best=q;fan=nd;} } }
    if(!fan){ for(const [nd,list] of adj){ for(const ix of list){ if(rows[ix].q>=best){best=rows[ix].q;fan=key(red.tramos[ix].f);} } } }
  }
  const acum=new Array(rows.length).fill(null), child=new Array(rows.length).fill(null), seen=new Set();
  const other=(ix,nd)=>{const t=red.tramos[ix];return key(t.i)===nd?key(t.f):key(t.i)};
  function go(ix,nd){ // nd = nudo lejano al ventilador
    seen.add(ix); let mx=0, mxi=null;
    for(const j of (adj.get(nd)||[])){ if(j===ix||seen.has(j)) continue; const v=go(j,other(j,nd)); if(v>mx){mx=v;mxi=j;} }
    acum[ix]=rows[ix].pt+mx; child[ix]=mxi; return acum[ix];
  }
  let maxP=0, first=null;
  if(fan) for(const ix of (adj.get(fan)||[])){ if(seen.has(ix)) continue; const v=go(ix,other(ix,fan)); if(v>maxP){maxP=v;first=ix;} }
  const crit=new Set(); const pathNodes=[];
  if(first!==null){ let ix=first, nd=fan; pathNodes.push(fan); while(ix!==null){ crit.add(ix); nd=other(ix,nd); pathNodes.push(nd); ix=child[ix]; } }
  const noconn=new Set(); rows.forEach((r,ix)=>{ if(r.ok&&acum[ix]===null) noconn.add(ix); });
  return {rows,acum,crit,maxP,fan,fanAuto,path:pathNodes.reverse(),noconn,vmax};
}

function medRed(red,calc,cfg){
  const m={chapa:new Map(),fibra:new Map(),circ:new Map()};
  red.tramos.forEach((t,ix)=>{
    const r=calc.rows[ix]; if(!r.ok) return;
    let grp,k,area;
    if(t.tipo==='circ'){ grp=m.circ; k=dm(r.diam); area=0; }
    else if(t.mat==='chapa'){ grp=m.chapa; k=dm(r.alto)+'×'+dm(r.ancho); area=uneChapa(r,cfg).m2; }
    else { grp=m.fibra; k=dm(r.alto)+'×'+dm(r.ancho); area=2*(r.alto+r.ancho+100)/1000*r.L; }
    const e=grp.get(k)||{k,ml:0,m2:0,codos:0,sort:t.tipo==='circ'?r.diam:r.alto*r.ancho};
    e.ml+=r.L; e.m2+=area; e.codos+=r.n; grp.set(k,e);
  });
  return m;
}
function mergeMed(list){
  const out={chapa:new Map(),fibra:new Map(),circ:new Map()};
  for(const m of list) for(const g of ['chapa','fibra','circ']) for(const [k,e] of m[g]){
    const o=out[g].get(k)||{k,ml:0,m2:0,codos:0,sort:e.sort}; o.ml+=e.ml;o.m2+=e.m2;o.codos+=e.codos; out[g].set(k,o);
  }
  return out;
}

const S={projects:{},cur:null,tab:null,db:null,mode:'init'};
const LS_KEY='conductos-v1';
function lsGet(){try{return JSON.parse(localStorage.getItem(LS_KEY)||'{}')}catch(e){return {}}}
function lsSet(){try{localStorage.setItem(LS_KEY,JSON.stringify(S.projects))}catch(e){}}
function lsUi(k,v){try{if(v===undefined)return localStorage.getItem('conductos-ui-'+k);localStorage.setItem('conductos-ui-'+k,v)}catch(e){return null}}

const timers={};
function touch(p,full){
  p.upd=Date.now(); lsSet();
  clearTimeout(timers[p.id]);
  setStatus('Guardando…');
  timers[p.id]=setTimeout(()=>save(p),700);
  if(full) render(); else refresh();
}
async function save(p){
  delete timers[p.id];
  if(!S.db){ setStatus('Guardado en este navegador'); return; }
  try{ await S.db.doc('proyectos/'+p.id).set(JSON.parse(JSON.stringify(p))); setStatus('Guardado en la nube ✓'); }
  catch(e){ if(e&&e.code==='unavailable'){ setTimeout(()=>save(p),1500+Math.random()*1000); } else setStatus('No se pudo guardar: '+(e&&e.message||e),true); }
}
function setStatus(t,err){const s=document.getElementById('status');s.textContent=t;s.classList.toggle('err',!!err)}

async function initStore(){
  S.projects=lsGet();
  S.cur=lsUi('cur'); if(!S.projects[S.cur]) S.cur=null;
  render();
  let db=null;
  try{ db=window.claude&&window.claude.use?await window.claude.use('db'):null; }catch(e){ db=null; }
  if(!db){ S.mode='local'; setStatus('Guardado solo en este navegador'); return; }
  S.db=db; S.mode='db'; setStatus('Conectado a la nube');
  let firstSnap=true;
  db.collection('proyectos').onSnapshot(snap=>{
    let changed=false;
    const remoteIds=new Set();
    for(const d of snap.docs){
      remoteIds.add(d.id);
      const data=d.data(); if(!data) continue;
      if(timers[d.id]) continue;
      const loc=S.projects[d.id];
      if(!loc||(data.upd||0)>(loc.upd||0)){ S.projects[d.id]=JSON.parse(JSON.stringify(data)); changed=true; }
    }
    for(const ch of snap.docChanges()){ if(ch.type==='removed'&&!timers[ch.doc.id]&&S.projects[ch.doc.id]){ delete S.projects[ch.doc.id]; changed=true; } }
    if(firstSnap){
      firstSnap=false;
      // proyectos creados sin conexión: se suben
      for(const id of Object.keys(S.projects)) if(!remoteIds.has(id)) save(S.projects[id]);
      if(S.cur&&!S.projects[S.cur]) S.cur=null;
      changed=true;
    }
    if(changed){ lsSet(); const ae=document.activeElement; if(!(ae&&ae.closest&&ae.closest('#main')&&ae.tagName==='INPUT')) render(); else renderSide(); }
  },err=>{ setStatus('Sin conexión con la nube; se guarda en este navegador',true); S.db=null; });
}

function pathTxt(calc){
  if(!calc.path.length) return '';
  let s='Recorrido: '+calc.path.map(esc).join(' → ')+' (ventilador)';
  if(calc.noconn.size) s+=` · <span class="vwarn">${calc.noconn.size} tramo(s) no conectados al ventilador</span>`;
  return s;
}

function medHTML(m,cfg){
  const mch=(num(cfg.mermaChapa)||0)/100, mfi=(num(cfg.mermaFibra)||0)/100;
  const sorted=g=>[...g.values()].sort((a,b)=>b.sort-a.sort);
  const rect=(g,merma,cls,title,note)=>{
    const list=sorted(g); const tm2=list.reduce((s,e)=>s+e.m2,0), tml=list.reduce((s,e)=>s+e.ml,0), tc=list.reduce((s,e)=>s+e.codos,0);
    return `<div class="mcol ${cls}"><h3>${title}<span class="num">${fmt(tm2*(1+merma),2)} m²</span></h3>${list.length?`<table class="mt"><thead><tr><th>Sección mm</th><th>ml</th><th>Codos</th><th>m²</th></tr></thead><tbody>
      ${list.map(e=>`<tr><td>${e.k}</td><td>${fmt(e.ml,2)}</td><td>${fmt(e.codos,0)}</td><td>${fmt(e.m2,2)}</td></tr>`).join('')}
      <tr class="tot"><td>Neto</td><td>${fmt(tml,2)}</td><td>${fmt(tc,0)}</td><td>${fmt(tm2,2)}</td></tr>
      <tr class="mer"><td colspan="3">Mermas ${fmt(merma*100,0)} %</td><td>${fmt(tm2*merma,2)}</td></tr>
      <tr class="fin"><td colspan="3">Total a medir</td><td>${fmt(tm2*(1+merma),2)}</td></tr></tbody></table>`:'<div class="empty">Ningún tramo marcado.</div>'}${note?`<div class="mnote">${note}</div>`:''}</div>`;
  };
  const cl=sorted(m.circ); const tml=cl.reduce((s,e)=>s+e.ml,0), tc=cl.reduce((s,e)=>s+e.codos,0);
  const circ=`<div class="mcol circ"><h3>Chapa circular<span class="num">${fmt(tml,2)} ml</span></h3>${cl.length?`<table class="mt"><thead><tr><th>Ø mm</th><th>ml</th><th>Codos</th></tr></thead><tbody>
    ${cl.map(e=>`<tr><td>Ø ${e.k}</td><td>${fmt(e.ml,2)}</td><td>${fmt(e.codos,0)}</td></tr>`).join('')}
    <tr class="fin"><td>Total</td><td>${fmt(tml,2)}</td><td>${fmt(tc,0)}</td></tr></tbody></table>`:'<div class="empty">Ningún tramo marcado.</div>'}</div>`;
  return `<div class="mgrid">${rect(m.chapa,mch,'chapa','Chapa rectangular',`Medición UNE 100716: piezas rectas de ${fmt(num(cfg.piezaL)||1,2)} m y unión de ${fmt(utVal(cfg),3)} m. Mínimo de 1 m² por pieza. Codos de 90° con L = π/2·(${dm(num(cfg.rInt)||0)} mm + ancho), descontados del tramo recto.`)}${rect(m.fibra,mfi,'fibra','Conducto de fibra','Fibra: (alto + ancho + 0,10) × 2 × longitud.')}${circ}</div>`;
}

      c.className=nc.className;
      nc.querySelectorAll('[data-o]').forEach(x=>{const o=c.querySelector(`[data-o="${x.dataset.o}"]`); if(o){o.innerHTML=x.innerHTML;o.className=x.className;}});
      ['alto','ancho','diam'].forEach(k=>{const a=c.querySelector(`input[data-k="${k}"]`),b=nc.querySelector(`input[data-k="${k}"]`); if(a&&b&&a!==ae){a.value=b.value;a.className=b.className;}});
    } else c.replaceWith(nc);
  });
  const set=(id,h)=>{const e=document.getElementById(id); if(e) e.textContent=h;};
  set('o_mtot',fmt(calc.maxP+(num(red.difusion)||0),1)+' Pa');

  set('m_pname',p.nombre||'Proyecto');
  const vent=document.getElementById('r_vent'); if(vent) vent.placeholder=calc.fan&&calc.fanAuto?'auto: '+calc.fan:'';
}

/* actualización ligera mientras se escribe (sin perder el foco) */
function refresh(){
  const p=P(); if(!p) return;
  if(isMob()) return mobRefresh(p);
  renderSide();
  const tabsEl=document.querySelectorAll('.tab[data-tab]');
  const calcs=p.redes.map(r=>calcRed(r,p.cfg));
  tabsEl.forEach(b=>{const i=p.redes.findIndex(r=>r.id===b.dataset.tab); if(i>=0){const pa=b.querySelector('.pa'); if(pa) pa.textContent=fmt(calcs[i].maxP+(num(p.redes[i].difusion)||0),0)+' Pa'; const nm=b.firstChild; if(nm) nm.textContent=p.redes[i].nombre||'Circuito';}});
  if(S.tab==='med'){ document.getElementById('view').innerHTML=projMedHTML(p,calcs); return; }
  const ix=p.redes.findIndex(r=>r.id===S.tab); if(ix<0) return;
  const red=p.redes[ix], calc=calcs[ix];
  const ae=document.activeElement;
  red.tramos.forEach((t,i)=>{
    const tr=document.querySelector(`tr[data-t="${t.id}"]`); if(!tr) return;
    if(tr.contains(ae)&&ae.tagName==='INPUT'){ // sustituir celdas salvo inputs
      const tmp=document.createElement('tbody'); tmp.innerHTML=rowHTML(red,t,calc,i); const nr=tmp.firstElementChild;
      tr.className=nr.className;
      nr.querySelectorAll('[data-o]').forEach(c=>{const o=tr.querySelector(`[data-o="${c.dataset.o}"]`); if(o){o.innerHTML=c.innerHTML;o.className=c.className;}});
      ['alto','ancho','diam'].forEach(k=>{const a=tr.querySelector(`input[data-k="${k}"]`),b=nr.querySelector(`input[data-k="${k}"]`); if(a&&b&&a!==ae){ a.value=b.value; a.className=b.className; a.title=b.title; }});
    } else { const tmp=document.createElement('tbody'); tmp.innerHTML=rowHTML(red,t,calc,i); tr.replaceWith(tmp.firstElementChild); }
  });
  const dif=num(red.difusion)||0;
  const set=(id,h)=>{const e=document.getElementById(id); if(e) e.innerHTML=h;};
  set('o_cond',fmt(calc.maxP,1)+'<small>Pa</small>');
  set('o_tot',fmt(calc.maxP+dif,1)+'<small>Pa</small>');
  set('o_tot2',`${fmt(calc.maxP,1)} conductos + ${fmt(dif,1)} difusión`);
  set('pathTxt',pathTxt(calc));
  set('medRed',medHTML(medRed(red,calc,p.cfg),p.cfg));
  const vent=document.getElementById('r_vent'); if(vent) vent.placeholder=calc.fan&&calc.fanAuto?'auto: '+calc.fan:'';
}

const main=document.getElementById('main');
main.addEventListener('input',e=>{

  if(el.dataset.p){ p[el.dataset.p]=el.value; touch(p); return; }
  if(el.dataset.c){ p.cfg[el.dataset.c]=el.value; touch(p,el.tagName==='SELECT'); return; }
  const red=curRed();
  if(el.dataset.r&&red){ red[el.dataset.r]=el.value; touch(p); return; }
  const tr=el.closest('[data-t]');
  if(tr&&red&&el.dataset.k){ const t=red.tramos.find(x=>x.id===tr.dataset.t); if(!t) return; t[el.dataset.k]=el.value; if(el.dataset.k==='ancho'||el.dataset.k==='diam') el.classList.add('fixed'); touch(p); }
});
main.addEventListener('toggle',e=>{ if(e.target.matches&&e.target.matches('details.cfg')) S.cfgOpen=e.target.open; },true);
main.addEventListener('change',e=>{ const el=e.target; if(el.dataset.k==='ancho'||el.dataset.k==='diam'){ setTimeout(refresh,0); } });

main.addEventListener('keydown',e=>{
  if(e.key!=='Enter') return;
  const el=e.target; const tr=el.closest&&el.closest('tr[data-t]'); if(!tr||!el.dataset.k) return;
  e.preventDefault();
  const k=el.dataset.k; let next=tr.nextElementSibling;
  if(!next){ addRow(); next=document.querySelector('#tb tr:last-child'); }
  const inp=next&&next.querySelector(`input[data-k="${k}"]`); if(inp){ inp.focus(); inp.select(); }
});

main.addEventListener('click',e=>{
  const p=P(); const el=e.target.closest('button,td.blk,[data-tab]'); if(!el) return;
  if(el.dataset.act) return act(el.dataset.act,el);
  if(el.dataset.step){ S.step=+el.dataset.step; render(); window.scrollTo(0,0); return; }
  if(el.dataset.tab){ S.tab=el.dataset.tab; render(); return; }
  if(!p) return;
  const red=curRed();
  if(el.dataset.tipodef&&red){ red.tipoDef=el.dataset.tipodef; touch(p,true); return; }
  const tr=el.closest('[data-t]'); if(!tr||!red) return;
  const ix=red.tramos.findIndex(x=>x.id===tr.dataset.t); const t=red.tramos[ix]; if(!t) return;
  if(el.dataset.pick){ if(el.dataset.pick==='circ') t.tipo='circ'; else { t.tipo='rect'; t.mat=el.dataset.pick; } touch(p,true); return; }
  if(el.dataset.auto){ t[el.dataset.auto]=''; touch(p,true); return; }
  if(el.dataset.row==='del'){ const [old]=red.tramos.splice(ix,1); touch(p,true); toast('Tramo '+(old.i||'')+' → '+(old.f||'')+' eliminado',()=>{red.tramos.splice(ix,0,old); touch(p,true);}); return; }
  if(el.dataset.row==='ins'){ red.tramos.splice(ix+1,0,newTramo(red,t)); touch(p,true); focusRow(ix+1,'q'); return; }
  if(el.dataset.row==='dup'){ const c={...t,id:uid()}; red.tramos.splice(ix+1,0,c); touch(p,true); return; }
  if(el.matches('td.blk')&&!e.target.closest('input')){ const want=el.dataset.sel; if(want==='circ'&&t.tipo!=='circ'){t.tipo='circ'; touch(p,true);} else if(want==='rect'&&t.tipo==='circ'){t.tipo='rect'; touch(p,true);} }
});
function focusRow(ix,k){ const rows=document.querySelectorAll('#tb [data-t]'); const r=rows[ix]; const i=r&&r.querySelector(`input[data-k="${k}"]`); if(i){ if(isMob()) r.scrollIntoView({block:'center'}); i.focus();i.select&&i.select();} }
function addRow(){ const p=P(), red=curRed(); if(!red) return; red.tramos.push(newTramo(red,red.tramos[red.tramos.length-1])); touch(p,true); }

let armed=null;
function arm(el,key,fn){ if(armed===key){ armed=null; fn(); return; } armed=key; el.classList.add('armed'); const t=el.textContent; el.textContent='¿Seguro? Pulsa otra vez'; setTimeout(()=>{ if(armed===key){armed=null; el.classList.remove('armed'); el.textContent=t;} },3500); }

async function act(a,el){
  const p=P(), red=curRed();
  switch(a){
    case 'projList': S.cur=null; lsUi('cur',''); render(); window.scrollTo(0,0); break;
    case 'newProj': { S.step=1; const np=newProject(); S.projects[np.id]=np; S.cur=np.id; S.tab=np.redes[0].id; lsUi('cur',np.id); touch(np,true); setTimeout(()=>{const i=document.getElementById('p_nombre'); if(i){i.focus(); i.select();}},30); break; }
    case 'example': { S.step=1; const np=exampleProject(); S.projects[np.id]=np; S.cur=np.id; S.tab=np.redes[0].id; lsUi('cur',np.id); touch(np,true); break; }
    case 'addRed': { const r=newRed('Circuito '+(p.redes.length+1)); p.redes.push(r); S.tab=r.id; touch(p,true); setTimeout(()=>{const i=document.getElementById('r_nombre'); if(i){i.focus(); i.select();}},30); break; }
    case 'addRow': addRow(); focusRow(red.tramos.length-1,'q'); break;
    case 'applyAll': if(red){ red.tramos.forEach(t=>{ if(red.tipoDef==='circ') t.tipo='circ'; else { t.tipo='rect'; t.mat=red.tipoDef; } }); touch(p,true); } break;
    case 'dupRed': if(red){ const c=JSON.parse(JSON.stringify(red)); c.id=uid(); c.nombre=red.nombre+' (copia)'; c.tramos.forEach(t=>t.id=uid()); p.redes.splice(p.redes.indexOf(red)+1,0,c); S.tab=c.id; touch(p,true); } break;
    case 'delRed': if(red) arm(el,'red'+red.id,()=>{ const ix=p.redes.indexOf(red); p.redes.splice(ix,1); S.tab=p.redes[Math.max(0,ix-1)]?.id||'med'; touch(p,true); toast('Circuito «'+red.nombre+'» eliminado',()=>{p.redes.splice(ix,0,red); S.tab=red.id; touch(p,true);}); }); break;
    case 'dupProj': { const c=JSON.parse(JSON.stringify(p)); c.id=uid(); c.nombre=p.nombre+' (copia)'; c.redes.forEach(r=>{r.id=uid(); r.tramos.forEach(t=>t.id=uid());}); S.projects[c.id]=c; S.cur=c.id; S.tab=null; lsUi('cur',c.id); touch(c,true); break; }
    case 'delProj': arm(el,'p'+p.id,async()=>{ const id=p.id; clearTimeout(timers[id]); delete timers[id]; delete S.projects[id]; S.cur=null; lsSet(); render(); if(S.db){ try{ await S.db.doc('proyectos/'+id).delete(); }catch(e){} } toast('Proyecto eliminado',()=>{ S.projects[id]=p; S.cur=id; touch(p,true); }); }); break;
    case 'copyTsv': copyTsv(p,red,el); break;
    case 'xlsx': exportXlsx(p,el); break;
    case 'pdf': exportPdf(p,null); break;
    case 'pdfRed': if(red) exportPdf(p,red.id); break;
    case 'backup': saveFile(`${fileBase(p)}.json`,JSON.stringify(p,null,1),el); break;
  }
}
document.getElementById('newProj').addEventListener('click',()=>act('newProj'));
document.getElementById('plist').addEventListener('click',e=>{const b=e.target.closest('[data-p]'); if(!b) return; S.cur=b.dataset.p; S.tab=null; S.step=1; lsUi('cur',S.cur); render(); window.scrollTo(0,0);});

    S.projects[d.id]=d; S.cur=d.id; S.tab=null; touch(d,true); toast('Proyecto «'+d.nombre+'» importado');

let toastT;
function toast(msg,undo){
  const t=document.getElementById('toast'); clearTimeout(toastT);
  t.innerHTML=`<span>${esc(msg)}</span>`+(undo?'<button type="button">Deshacer</button>':''); t.hidden=false;

/* ================== INFORME PDF ================== */
function loadScript(src){ return new Promise((ok,ko)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=ko; document.head.appendChild(s); }); }
async function loadPDF(){
  if(!(window.jspdf&&window.jspdf.jsPDF)) await loadScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js');
  const J=window.jspdf.jsPDF;
  if(!J.API.autoTable) await loadScript('https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js');
  return J;
}
const pdfT=s=>String(s??'').replace(/²/g,'2').replace(/³/g,'3').replace(/→/g,'-').replace(/π/g,'pi').replace(/≤/g,'<=').replace(/●/g,'*').replace(/…/g,'...').replace(/[^\x20-\xff€–—‘’“”•]/g,'');
const tipoTxt=t=>t.tipo==='circ'?'Chapa circ.':(t.mat==='chapa'?'Chapa rect.':'Fibra rect.');
async function exportPdf(p,onlyRed){
  let J; try{ J=await loadPDF(); }catch(e){ toast('No se pudo cargar el generador de PDF (sin conexión).'); return; }
  const doc=new J({unit:'mm',format:'a4',orientation:'portrait'});
  const W=210, M=14, BLUE=[58,86,153], GREEN=[11,122,82], GREY=[90,100,110], LIGHT=[236,240,248];
  const calcs=p.redes.map(r=>calcRed(r,p.cfg));
  const redes=onlyRed?p.redes.filter(r=>r.id===onlyRed):p.redes;
  const C=p.cfg, mch=(num(C.mermaChapa)||0)/100, mfi=(num(C.mermaFibra)||0)/100;
  const title=onlyRed?'INFORME DE CÁLCULO DE CIRCUITO':'INFORME DE CÁLCULO DE CONDUCTOS';
  const fecha=p.fecha?p.fecha.split('-').reverse().join('/'):'';
  const top=34;
  const header=()=>{
    try{ doc.addImage(LOGO_W,'PNG',M,8,20,20); }catch(e){}
    doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(...BLUE);
    doc.text(pdfT(title),W-M,14,{align:'right'});
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...GREY);
    doc.text(pdfT([p.estudio?('Estudio '+p.estudio):'',p.nombre].filter(Boolean).join('  ·  ')),W-M,20,{align:'right'});
    doc.text(pdfT([p.cliente,p.oferta?('Oferta '+p.oferta):'',fecha].filter(Boolean).join('  ·  ')),W-M,25,{align:'right'});
    doc.setDrawColor(...BLUE); doc.setLineWidth(0.6); doc.line(M,30,W-M,30);
    doc.setDrawColor(...GREEN); doc.setLineWidth(0.3); doc.line(M,31.2,W-M,31.2);
  };
  const tbl=(opts)=>{ doc.autoTable(Object.assign({margin:{left:M,right:M,top:top+2},theme:'grid',
    styles:{font:'helvetica',fontSize:8.5,cellPadding:1.6,lineColor:[205,212,222],lineWidth:0.15,textColor:[25,32,40]},
    headStyles:{fillColor:BLUE,textColor:255,fontStyle:'bold',halign:'center'},
    didDrawPage:header},opts)); return doc.lastAutoTable.finalY; };
  const h2=(txt,y)=>{ if(y>262){ doc.addPage(); y=top+4; } doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(...BLUE); doc.text(pdfT(txt),M,y); doc.setTextColor(25,32,40); return y+3; };
  const R=(x,d=2)=>fmt(x,d);

  header();
  // 1. Identificación
  let y=h2('1. Identificación',top+6);
  const ident=[['Estudio',p.estudio||'—'],['Proyecto',p.nombre||'—'],['Cliente',p.cliente||'—'],['Emplazamiento',p.emplazamiento||'—'],['Nº oferta',p.oferta||'—'],['Fecha',fecha||'—'],['Redactado por',p.autor||'—']];
  if(onlyRed){ const r=redes[0]; ident.push(['Circuito',r.nombre||'—'],['Tipo de circuito',r.tipoCirc||'—'],['Equipo / ventilador',r.equipo||'—']); }
  y=tbl({startY:y,body:ident.map(([a,b])=>[pdfT(a),pdfT(b)]),theme:'plain',styles:{font:'helvetica',fontSize:10,cellPadding:1.4},columnStyles:{0:{fontStyle:'bold',cellWidth:42,textColor:GREY}}});
  // 2. Criterios
  y=h2('2. Criterios de cálculo',y+8);
  const crit=[
    'Pérdida de carga por rozamiento: método Carrier (ábaco de rozamiento en conductos de chapa), diámetro equivalente en conductos rectangulares 1,30·(a·b)^0,625/(a+b)^0,25.',
    'Codos: longitud equivalente según relación de lados del conducto. Pérdida acumulada por el recorrido más desfavorable hasta el ventilador.',
    'Dimensionado por velocidad máxima de cada circuito. Rectangular: alto fijado y ancho en pasos de '+R(num(C.paso)||50,0)+' mm (mín. '+R(num(C.anchoMin)||150,0)+' mm), relación de lados máx. 1:'+R(num(C.relMax)||3,0)+'. Circular: serie normalizada.',
    'Medición chapa rectangular según UNE 100716: piezas de '+R(num(C.piezaL)||1,2)+' m, unión transversal '+R(utVal(C),3)+' m, mínimo 1 m² por pieza, codos L = pi/2·(R '+R(num(C.rInt)||0,0)+' mm + ancho). Mermas '+R(mch*100,0)+' %.',
    'Medición conducto de fibra: (alto + ancho + 0,10)·2·longitud. Mermas '+R(mfi*100,0)+' %. Chapa circular en metros lineales por diámetro.'];
  y=tbl({startY:y,body:crit.map(c=>['•',pdfT(c)]),theme:'plain',styles:{font:'helvetica',fontSize:9,cellPadding:1.2},columnStyles:{0:{cellWidth:5}}});
  // 3. Resumen
  if(!onlyRed){
    y=h2('3. Resumen de pérdidas de carga por circuito',y+8);
    const body=p.redes.map((r,i)=>{const d=num(r.difusion)||0; const qmax=Math.max(0,...calcs[i].rows.filter(x=>x.ok).map(x=>x.q)); return [pdfT(r.nombre),pdfT(r.tipoCirc||''),pdfT(r.equipo||''),R(qmax,0),R(calcs[i].maxP,1),R(d,1),R(calcs[i].maxP+d,1)];});
    y=tbl({startY:y,head:[['Circuito','Tipo','Equipo','Caudal máx. m³/h','Conductos Pa','Difusión Pa','Total Pa']].map(r=>r.map(pdfT)),body,columnStyles:{3:{halign:'right'},4:{halign:'right'},5:{halign:'right'},6:{halign:'right',fontStyle:'bold'}}});
  }
  // 4. Circuitos
  let sec=onlyRed?3:4;
  redes.forEach(red=>{
    const ix=p.redes.indexOf(red), c=calcs[ix];
    doc.addPage(); header(); y=top+6;
    y=h2(`${sec}. Circuito: ${red.nombre||''}`,y);
    const d=num(red.difusion)||0;
    y=tbl({startY:y,theme:'plain',styles:{font:'helvetica',fontSize:9.5,cellPadding:1.2},columnStyles:{0:{fontStyle:'bold',textColor:GREY,cellWidth:42},2:{fontStyle:'bold',textColor:GREY,cellWidth:38}},
      body:[[ 'Tipo de circuito',pdfT(red.tipoCirc||'—'),'Equipo / ventilador',pdfT(red.equipo||'—')],
            ['Velocidad máxima',R(num(red.vmax)||0,1)+' m/s','Nudo ventilador',pdfT(c.fan||'—')],
            ['Recorrido crítico',{content:pdfT(c.path.join(' - ')),colSpan:3}]]});
    // tabla de tramos
    y=h2(`${sec}.1 Cálculo de tramos`,y+7);
    const body=red.tramos.map((t,i)=>{ const r=c.rows[i]; if(!r.ok) return [pdfT(t.i+' - '+t.f),'','','','','','','','',''];
      const isC=t.tipo==='circ', s=r.sel;
      return [pdfT(t.i+' - '+t.f),R(r.q,0),R(r.L,2),R(r.n,0),pdfT(tipoTxt(t)),isC?('Ø '+dm(r.diam)):(dm(r.alto)+' × '+dm(r.ancho)),R(s.v,2),R(s.paM,2),R(s.pt,2),(c.acum[i]!==null?R(c.acum[i],2):'—')+(c.crit.has(i)?' *':'')];});
    y=tbl({startY:y,head:[['Tramo','Caudal m³/h','Long. m','Codos','Tipo','Sección mm','v m/s','Pa/m','Pt Pa','Pt acum. Pa']].map(r=>r.map(pdfT)),body,
      columnStyles:{0:{halign:'center'},1:{halign:'right'},2:{halign:'right'},3:{halign:'center'},5:{halign:'center'},6:{halign:'right'},7:{halign:'right'},8:{halign:'right'},9:{halign:'right',fontStyle:'bold'}},
      didParseCell:h=>{ if(h.section==='body'){ const t=red.tramos[h.row.index]; if(t&&h.column.index===4){ h.cell.styles.fillColor=t.tipo==='circ'?[217,239,227]:(t.mat==='chapa'?[220,235,247]:[247,235,205]); } } }});
    doc.setFont('helvetica','italic'); doc.setFontSize(8); doc.setTextColor(...GREY); doc.text('* Tramo del recorrido más desfavorable.',M,y+4);
    // pérdidas
    y=h2(`${sec}.2 Pérdida de carga`,y+12);
    y=tbl({startY:y,body:[['Conductos (recorrido más desfavorable)',R(c.maxP,1)+' Pa'],['Elemento de difusión'+(red.difusionNota?(': '+red.difusionNota):''),R(d,1)+' Pa'],['PÉRDIDA DE CARGA TOTAL',R(c.maxP+d,1)+' Pa']].map(r=>r.map(pdfT)),
      styles:{font:'helvetica',fontSize:10,cellPadding:2.2},columnStyles:{1:{halign:'right',cellWidth:40}},
      didParseCell:h=>{ if(h.row.index===2){ h.cell.styles.fillColor=BLUE; h.cell.styles.textColor=255; h.cell.styles.fontStyle='bold'; } }});
    // medición circuito
    y=h2(`${sec}.3 Medición del circuito`,y+9);
    y=pdfMed(medRed(red,c,p.cfg),y);
    sec++;
  });
  if(!onlyRed&&p.redes.length>1){
    doc.addPage(); header(); y=h2(`${sec}. Medición total del proyecto`,top+6);
    y=pdfMed(mergeMed(p.redes.map((r,i)=>medRed(r,calcs[i],p.cfg))),y);
  } else if(!onlyRed&&p.redes.length===1){ /* medición total = la del único circuito */ }
  function pdfMed(m,y){
    const sorted=g=>[...g.values()].sort((a,b)=>b.sort-a.sort);
    const body=[];
    const groupRect=(g,label,merma)=>{ const l=sorted(g); if(!l.length) return; body.push([{content:pdfT(label),colSpan:5,styles:{fontStyle:'bold',fillColor:LIGHT}}]);
      let t=0; l.forEach(e=>{ body.push(['',e.k,R(e.ml),R(e.codos,0),R(e.m2)]); t+=e.m2; });
      body.push(['','Neto','','',R(t)],['','Mermas '+R(merma*100,0)+' %','','',R(t*merma)],[{content:'Total '+pdfT(label),colSpan:4,styles:{fontStyle:'bold',halign:'right'}},{content:R(t*(1+merma))+' m2',styles:{fontStyle:'bold'}}]); };
    groupRect(m.chapa,'Chapa rectangular (UNE 100716)',mch);
    groupRect(m.fibra,'Conducto de fibra',mfi);
    const lc=sorted(m.circ); if(lc.length){ body.push([{content:'Chapa circular',colSpan:5,styles:{fontStyle:'bold',fillColor:LIGHT}}]); let t=0; lc.forEach(e=>{ body.push(['','Ø '+e.k,R(e.ml),R(e.codos,0),'']); t+=e.ml; }); body.push([{content:'Total chapa circular',colSpan:2,styles:{fontStyle:'bold',halign:'right'}},{content:R(t)+' ml',styles:{fontStyle:'bold'}},'','']); }
    if(!body.length) body.push([{content:'Sin tramos medidos.',colSpan:5}]);
    return tbl({startY:y,head:[['Tipo','Sección / Ø mm','ml','Codos','m²']].map(r=>r.map(pdfT)),body:body.map(r=>r.map(x=>typeof x==='string'?pdfT(x):x)),columnStyles:{0:{cellWidth:22},2:{halign:'right'},3:{halign:'center'},4:{halign:'right'}}});
  }
  // pie con paginación
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...GREY);
    doc.setDrawColor(205,212,222); doc.setLineWidth(0.2); doc.line(M,284,W-M,284);
    doc.text(pdfT([p.estudio?('Estudio '+p.estudio):'',p.nombre,onlyRed?redes[0].nombre:''].filter(Boolean).join(' · ')),M,289);
    doc.text(`Página ${i} de ${n}`,W-M,289,{align:'right'}); }
  const nm=fileBase(p)+(onlyRed?'_'+fileBase({nombre:redes[0].nombre}):'')+'_informe.pdf';
  saveFile(nm,doc.output('blob'));
}

/* ================== EXPORTACIÓN ================== */
const fileBase=p=>(p.nombre||'proyecto').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_').slice(0,60)||'proyecto';
let dlNs; async function dl(){ if(dlNs!==undefined) return dlNs; try{ dlNs=window.claude&&window.claude.use?await window.claude.use('downloads'):null; }catch(e){ dlNs=null; } return dlNs; }
async function saveFile(name,data,btn){
  const d=await dl();
  if(!d){
    if(window.claude){ toast('La descarga no está disponible en esta vista. Usa «Copiar tabla» y pégala en Excel.'); return; }
    const blob=data instanceof Blob?data:new Blob([data],{type:'application/octet-stream'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},2000); toast('Descargado: '+name); return;
  }
  try{ await d.save({filename:name,data}); toast('Archivo preparado: '+name); }
  catch(e){ if(e&&e.code==='declined') return; toast('No se pudo descargar: '+(e&&e.message||e)); }
}
function tableRows(p,red){
  const c=calcRed(red,p.cfg);
  const head=['I','F','Caudal m³/h','Long. m','Codos','Tipo','Alto mm','Ancho mm','Ø mm','v m/s','Pa/m','Pt Pa','Pt acum. Pa','Recorrido crítico'];
  const body=red.tramos.map((t,ix)=>{ const r=c.rows[ix]; if(!r.ok) return [t.i,t.f,t.q,t.l,t.n,'','','','','','','','',''];
    const isC=t.tipo==='circ', s=r.sel, tipo=isC?'Chapa circular':(t.mat==='chapa'?'Chapa rectangular':'Fibra rectangular');
    const R=(x,d)=>Math.round(x*10**d)/10**d;
    return [t.i,t.f,r.q,r.L,r.n,tipo,isC?'':r.alto,isC?'':r.ancho,isC?r.diam:'',R(s.v,2),R(s.paM,2),R(s.pt,2),c.acum[ix]!==null?R(c.acum[ix],2):'',c.crit.has(ix)?'Sí':''];});
  return {head,body,c};
}
async function copyTsv(p,red,btn){
  const {head,body,c}=tableRows(p,red);
  const dif=num(red.difusion)||0;
  const lines=[head,...body,[],['Conductos (Pa)',c.maxP.toFixed(2)],['Elemento de difusión (Pa)',dif.toFixed(2),red.difusionNota||''],['Total (Pa)',(c.maxP+dif).toFixed(2)]];
  const txt=lines.map(r=>r.map(x=>typeof x==='number'?String(x).replace('.',','):String(x??'')).join('\t')).join('\n');
  try{ await navigator.clipboard.writeText(txt); toast('Tabla copiada. Pégala en Excel.'); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); toast('Tabla copiada. Pégala en Excel.');}catch(_){toast('No se pudo copiar.');} ta.remove(); }
}
function loadXLSX(){ return new Promise((ok,ko)=>{ if(window.XLSX) return ok(window.XLSX); const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload=()=>ok(window.XLSX); s.onerror=ko; document.head.appendChild(s); }); }
async function exportXlsx(p,btn){
  let X; try{ X=await loadXLSX(); }catch(e){ toast('No se pudo cargar el generador de Excel.'); return; }
  const wb=X.utils.book_new();
  const calcs=p.redes.map(r=>calcRed(r,p.cfg));
  const meds=p.redes.map((r,i)=>medRed(r,calcs[i],p.cfg)); const all=mergeMed(meds);
  const mch=(num(p.cfg.mermaChapa)||0)/100, mfi=(num(p.cfg.mermaFibra)||0)/100;
  const R=(x,d=2)=>Math.round(x*10**d)/10**d;
  const res=[['Estudio',p.estudio||''],['Proyecto',p.nombre],['Cliente',p.cliente],['Emplazamiento',p.emplazamiento||''],['Nº oferta',p.oferta],['Fecha',p.fecha],['Redactado por',p.autor||''],[],['Circuito','Tipo','Equipo','Velocidad máx. m/s','Conductos Pa','Elemento difusión Pa','Descripción difusión','Total Pa']];
  p.redes.forEach((r,i)=>{const d=num(r.difusion)||0; res.push([r.nombre,r.tipoCirc||'',r.equipo||'',num(r.vmax),R(calcs[i].maxP),d,r.difusionNota||'',R(calcs[i].maxP+d)]);});
  const ws0=X.utils.aoa_to_sheet(res); ws0['!cols']=[{wch:28},{wch:14},{wch:20},{wch:16},{wch:14},{wch:18},{wch:30},{wch:12}]; X.utils.book_append_sheet(wb,ws0,'Resumen');
  const med=[['MEDICIÓN DEL PROYECTO'],[],['Chapa rectangular','Sección mm','ml','Codos','m²']];
  const add=(g,lab,merma)=>{ const l=[...g.values()].sort((a,b)=>b.sort-a.sort); let t=0; l.forEach(e=>{med.push(['',e.k,R(e.ml),e.codos,R(e.m2)]); t+=e.m2;}); med.push(['','Neto','','',R(t)],['','Mermas '+R(merma*100,0)+' %','','',R(t*merma)],['','TOTAL '+lab,'','',R(t*(1+merma))],[]); };
  add(all.chapa,'chapa rectangular (UNE 100716)',mch);
  med.push(['','Criterio UNE 100716: piezas de '+(num(p.cfg.piezaL)||1)+' m, UT '+utVal(p.cfg)+' m, mínimo 1 m² por pieza, codos L = π/2·(R '+(num(p.cfg.rInt)||0)+' mm + ancho)'],[]);
  med.push(['Conducto de fibra','Sección mm','ml','Codos','m²']); add(all.fibra,'fibra',mfi);
  med.push(['Chapa circular','Ø mm','ml','Codos']); let tc=0; [...all.circ.values()].sort((a,b)=>b.sort-a.sort).forEach(e=>{med.push(['',e.k,R(e.ml),e.codos]); tc+=e.ml;}); med.push(['','TOTAL ml',R(tc)]);
  const ws1=X.utils.aoa_to_sheet(med); ws1['!cols']=[{wch:20},{wch:22},{wch:10},{wch:8},{wch:10}]; X.utils.book_append_sheet(wb,ws1,'Medición');
  const used=new Set(['Resumen','Medición']);
  p.redes.forEach((r,i)=>{ const {head,body,c}=tableRows(p,r); const d=num(r.difusion)||0;
    const aoa=[['Circuito',r.nombre],['Tipo',r.tipoCirc||''],['Equipo / ventilador',r.equipo||''],['Velocidad máx. (m/s)',num(r.vmax)],[],head,...body,[],['Conductos (Pa)',R(c.maxP)],['Elemento de difusión (Pa)',d,r.difusionNota||''],['Total (Pa)',R(c.maxP+d)]];
    const ws=X.utils.aoa_to_sheet(aoa); ws['!cols']=head.map((h,j)=>({wch:j===5?18:11}));
    let nm=(r.nombre||'Red').replace(/[\\\/\?\*\[\]:]/g,'').slice(0,28)||'Red'; let k=nm,n=2; while(used.has(k)) k=nm.slice(0,25)+' '+(n++); used.add(k);
    X.utils.book_append_sheet(wb,ws,k); });
  const buf=X.write(wb,{bookType:'xlsx',type:'array'});
  saveFile(fileBase(p)+'.xlsx',new Blob([buf]),btn);
}
